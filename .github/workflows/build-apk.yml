name: Build APK Rastreador GPS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Dar permissão ao Gradle Wrapper
        run: |
          chmod +x android-app/gradlew

      - name: Compilar APK Android
        run: |
          cd android-app
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Preparar APK para Download
        run: |
          mkdir -p release-apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk release-apk/RastreadorGPS.apk

      - name: Fazer Upload do APK nos Artefatos
        uses: actions/upload-artifact@v4
        with:
          name: RastreadorGPS-APK
          path: release-apk/RastreadorGPS.apk

      - name: Publicar Release com Download Direto do APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "📱 Rastreador GPS Mobile (APK Oficial)"
          body: |
            ## 📥 Download do Rastreador GPS para Celular Android
            
            Clique abaixo para baixar o instalador no seu celular:
            - **[👉 BAIXAR RastreadorGPS.apk](https://github.com/Rayan-Novik/Rastreador/releases/download/v1.0.0/RastreadorGPS.apk)**
            
            ### 🛠️ Configurações Pré-definidas no App:
            - **Servidor:** `http://169.58.140.109:6548`
            - **Segundo Plano:** Ativo 24/7 (requer permissão de localização "Permitir o tempo todo").
            - **Ícone:** Personalizado com o logo oficial do app.
          files: release-apk/RastreadorGPS.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
